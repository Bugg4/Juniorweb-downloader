name: Payroll Check

on:
  schedule:
    # 17:00 UTC every Monday
    - cron: '0 17 * * 1'
    # 17:00 UTC every day from 10th to 20th of the month
    - cron: '0 17 10-20 * *'
  workflow_dispatch:

jobs:
  check-payroll:
    runs-on: ubuntu-latest
    environment: Credentials
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install python
        run: uv python install

      - name: Run Downloader
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COMPANY: ${{ secrets.COMPANY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          uv run main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Never commit a missing, invalid, or empty list. An empty response
          # usually means the portal returned a login/error page.
          if [ ! -f file_list.json ]; then
            echo "::error::file_list.json was not produced; refusing to commit."
            exit 1
          fi
          if ! jq . file_list.json > file_list.json.tmp; then
            rm -f file_list.json.tmp
            echo "::error::file_list.json is invalid JSON; refusing to commit."
            exit 1
          fi
          mv file_list.json.tmp file_list.json
          if ! jq -e 'type == "array" and length > 0' file_list.json >/dev/null; then
            echo "::error::file_list.json is empty or not an array; refusing to commit."
            exit 1
          fi

          git add file_list.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update file list [skip ci]" && git push)
